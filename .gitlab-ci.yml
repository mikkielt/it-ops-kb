# CI for it-ops-kb: the tests (Python 3.14, the 3.11 floor, Windows), the stress suite and KB-* commit trailers. The
# tools are stdlib Python; the tests run with pytest and pytest-xdist, which uv installs from uv.lock (pyproject.toml's
# dev group). A pipeline is created for every branch push and every tag; the query log's conflict MR (a
# `querylog/<run-id>` branch, kb/_self/querylog.md) runs through the branch rule. Every job runs on the project's own
# runners (kb/_self/runners.md): the Linux jobs name `docker-linux`, kb-tests-windows `docker-windows`. Every job is
# manual (`when: manual`, `allow_failure: true`: a manual job in `rules` otherwise blocks the pipeline,
# docs.gitlab.com/ci/jobs/job_control), so no push or merge request waits on a pipeline; the local push gate
# (kb/_self/maintaining.md) is the gate, and a person starts a job to run it on the runners, kb-tests-windows above all
# (the only Windows run). No job writes to the repository.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: python:3.14-slim
  interruptible: true

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache/]

stages: [test]

# The full image has git, so the git scenarios (merge, history, sync, research merge, census) run instead of skipping;
# a full clone keeps the commits the research-merge scenario replays.
kb-tests:
  stage: test
  tags: [docker-linux]
  image: python:3.14
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - pip install --quiet uv
    - python3 _tools/tests.py
  rules:
    - when: manual
      allow_failure: true

# The tools' floor (pyproject.toml requires-python >=3.11): the same tests on the image's Python 3.11 instead of the
# 3.14 pinned in .python-version (UV_PYTHON takes precedence over it), without the git scenarios.
kb-tests-floor:
  stage: test
  tags: [docker-linux]
  image: python:3.11
  variables:
    UV_PYTHON: "3.11"
    KB_TESTS_FAST: "1"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - pip install --quiet uv
    - python3 _tools/tests.py
  rules:
    - when: manual
      allow_failure: true

# The same tests, then the stress suite, on Windows: the project's docker-windows runner. A fresh Windows Server 2025 container per job
# (Hyper-V isolation, Windows PowerShell 5.1), one job at a time; a job waits as pending while the runner is offline.
# The image's `python` installs uv, and uv the pinned CPython; MinGit (SHA-256 checked) puts git on PATH and its own
# sh last, as Git Bash would have it, so the launcher tests run too.
kb-tests-windows:
  stage: test
  tags: [docker-windows]
  image: python:3.14-windowsservercore-ltsc2025
  # The run takes longer than the gap between the query log's automatic pushes: once started, a newer pipeline on
  # main does not cancel it (auto_cancel on_new_commit conservative, the default).
  interruptible: false
  # tests.py then stress_test.py in a Hyper-V container (6 vCPUs, 12 GB: the runner's config.toml, kb/_self/runners.md)
  # outlast the project's 1 h default; a job-level timeout takes precedence over the project's.
  timeout: 3h
  variables:
    GIT_DEPTH: "0"
    MINGIT_URL: https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.1/MinGit-2.56.0-64-bit.zip
    MINGIT_SHA256: 064b440ff870ed5198527e8f3a92cdf5bd2fd0fedf5e718af95e3fdaddeff718
    # The clone belongs to another account than the container's user, and the tests' git runs without global or
    # system config: safe.directory from the environment is command-line scope, which git honours.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "*"
  script:
    - |
      $ProgressPreference = 'SilentlyContinue'
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Invoke-WebRequest -UseBasicParsing -Uri $env:MINGIT_URL -OutFile C:\mingit.zip
      if ((Get-FileHash C:\mingit.zip -Algorithm SHA256).Hash -ne $env:MINGIT_SHA256) { Write-Error 'MinGit SHA-256 mismatch'; exit 1 }
      Expand-Archive C:\mingit.zip -DestinationPath C:\MinGit
      $env:PATH = 'C:\MinGit\cmd;' + $env:PATH
    - git config --global --add safe.directory '*'
    - python --version
    - python -m pip install --quiet --disable-pip-version-check uv
    - |
      $env:PATH = 'C:\MinGit\cmd;' + (python -c "import sysconfig; print(sysconfig.get_path('scripts'))") + ';' + $env:PATH + ';C:\MinGit\usr\bin'
      uv --version
      # a test past 900 s dumps every thread's stack (three fixtures take 300-450 s locally); the slowest are listed
      python _tools/tests.py -o faulthandler_timeout=900 --durations=15
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # the stress suite on Windows too; PowerShell 5.1 does not stop on a native command's exit code
      python _tools/stress_test.py
      exit $LASTEXITCODE
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - _tools/**/*
        - .claude/**/*
        - .claude-plugin/**/*
        - .githooks/**/*
        - .gitlab-ci.yml
        - pyproject.toml
        - uv.lock
      # offered for tool changes, started by a click
      when: manual
      allow_failure: true

tool-stress:
  stage: test
  tags: [docker-linux]
  script:
    - pip install --quiet uv
    - python3 _tools/stress_test.py
  rules:
    - changes:
        - _tools/**/*
        - .claude/skills/**/*.py
      when: manual
      allow_failure: true

# KB-* commit trailers (kbgit.py check-trailers) on the pushed commits: CI_COMMIT_BEFORE_SHA..CI_COMMIT_SHA, or only
# CI_COMMIT_SHA for a new branch (before sha all zeros). Needs git, which python:3.14-slim lacks: the full python:3.14
# image has it. GIT_DEPTH 0 (full clone): a shallow clone may miss the before sha or the exemption cutoff commit.
kb-trailers:
  stage: test
  tags: [docker-linux]
  image: python:3.14
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python3 _tools/kbgit.py check-trailers
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
