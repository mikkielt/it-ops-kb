# CI for it-ops-kb: the tests (Python 3.14, the 3.11 floor, Windows), the stress suite and KB-* commit trailers. The
# tools are stdlib Python; the tests run with pytest and pytest-xdist, which uv installs from uv.lock (pyproject.toml's
# dev group). A pipeline is created for every branch push and every tag; the query log's conflict MR (a
# `querylog/<run-id>` branch, kb/_self/querylog.md) runs through the branch rule. Every job is manual: `when: manual`
# with `allow_failure: true` in its rules, since a manual job in `rules` otherwise blocks the pipeline
# (docs.gitlab.com/ci/jobs/job_control). No job writes to the repository.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: python:3.14-slim
  interruptible: true

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache/]

stages: [test]

# The full image has git, so the git scenarios (merge, history, sync, research merge, census) run instead of skipping;
# a full clone keeps the commits the research-merge scenario replays.
kb-tests:
  stage: test
  image: python:3.14
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - pip install --quiet uv
    - python3 _tools/tests.py
  rules:
    - when: manual
      allow_failure: true

# The tools' floor (pyproject.toml requires-python >=3.11): the same tests on the image's Python 3.11 instead of the
# 3.14 pinned in .python-version (UV_PYTHON takes precedence over it), without the git scenarios.
kb-tests-floor:
  stage: test
  image: python:3.11
  variables:
    UV_PYTHON: "3.11"
    KB_TESTS_FAST: "1"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - pip install --quiet uv
    - python3 _tools/tests.py
  rules:
    - when: manual
      allow_failure: true

# The same tests on Windows: GitLab.com's hosted Windows runner (kb/public/gitlab/hosted-runners-windows.md). A fresh
# Windows Server 2022 VM per job, PowerShell, no image: its preinstalled `python` installs uv, and uv the pinned
# CPython; MinGit's own sh goes on PATH last, as Git Bash would have it, so the launcher tests run too.
kb-tests-windows:
  stage: test
  tags: [saas-windows-medium-amd64]
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory '*'
    - python --version
    - python -m pip install --quiet --disable-pip-version-check uv
    - |
      $env:PATH = (python -c "import sysconfig; print(sysconfig.get_path('scripts'))") + ';' + $env:PATH
      if (Test-Path C:\Git\usr\bin\sh.exe) { $env:PATH += ';C:\Git\usr\bin' }
      uv --version
      python _tools/tests.py
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - _tools/**/*
        - .claude/**/*
        - .claude-plugin/**/*
        - .githooks/**/*
        - .gitlab-ci.yml
        - pyproject.toml
        - uv.lock
      when: manual
      allow_failure: true

tool-stress:
  stage: test
  script:
    - pip install --quiet uv
    - python3 _tools/stress_test.py
  rules:
    - changes:
        - _tools/**/*
        - .claude/skills/**/*.py
      when: manual
      allow_failure: true

# KB-* commit trailers (kbgit.py check-trailers) on the pushed commits: CI_COMMIT_BEFORE_SHA..CI_COMMIT_SHA, or only
# CI_COMMIT_SHA for a new branch (before sha all zeros). Needs git, which python:3.14-slim lacks: the full python:3.14
# image has it. GIT_DEPTH 0 (full clone): a shallow clone may miss the before sha or the exemption cutoff commit.
kb-trailers:
  stage: test
  image: python:3.14
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python3 _tools/kbgit.py check-trailers
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
