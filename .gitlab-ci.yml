# Minimal CI for it-ops-kb: documentation cohesion, leak detection and KB-* commit trailers. Stdlib Python only.
# Direct-push model: people push to main (after `kbgit.py sync --push`, which runs the same gate locally); there are
# no merge requests. CI is the safety net: a pipeline on every branch push and on every tag.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: python:3.12-slim
  interruptible: true

variables:
  PYTHONDONTWRITEBYTECODE: "1"

stages: [test]

# The full image has git, so the git scenarios (merge, history, sync, research merge, census) run instead of skipping;
# a full clone keeps the commits the research-merge scenario replays.
kb-tests:
  stage: test
  image: python:3.12
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python3 _tools/tests.py

tool-stress:
  stage: test
  script:
    - python3 _tools/stress_test.py
  rules:
    - changes:
        - _tools/**/*
        - .claude/skills/**/*.py

# KB-* commit trailers (kbgit.py check-trailers) on the pushed commits: CI_COMMIT_BEFORE_SHA..CI_COMMIT_SHA, or only
# CI_COMMIT_SHA for a new branch (before sha all zeros). Needs git, which python:3.12-slim lacks: the full python:3.12
# image has it. GIT_DEPTH 0 (full clone): a shallow clone may miss the before sha or the exemption cutoff commit.
kb-trailers:
  stage: test
  image: python:3.12
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python3 _tools/kbgit.py check-trailers
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
