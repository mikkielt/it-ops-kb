# CI for it-ops-kb: two manual jobs, the tests with the KB-* commit trailers check on Linux and on the tools' Python
# floor (3.11), and the tests on Windows. The tools are stdlib Python; the tests run with pytest, which uv installs from
# uv.lock (pyproject.toml's dev group). A pipeline is created for every branch push and every tag. Every job runs on
# the project's own runners (kb/_self/runners.md): kb-tests names `docker-linux`, kb-tests-windows `docker-windows`.
# Both jobs are manual (`when: manual`, `allow_failure: true`: a manual job in `rules` otherwise blocks the pipeline,
# docs.gitlab.com/ci/jobs/job_control), so no push or merge request waits on a pipeline. The local push gate
# (kb/_self/maintaining.md) is the gate; the pipeline exists so `kbgit.py publish` can read a CI verdict of the source
# commit. No job writes to the repository.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: python:3.14-slim
  interruptible: true

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache/]

stages: [test]

# The tools' floor (pyproject.toml requires-python >=3.11): the suite on the image's Python 3.11 instead of the 3.14
# pinned in .python-version (UV_PYTHON takes precedence over it). The full image has git; a full clone (GIT_DEPTH 0)
# keeps the commits the KB-* trailers check (kbgit.py check-trailers) reads.
kb-tests:
  stage: test
  tags: [docker-linux]
  image: python:3.11
  variables:
    UV_PYTHON: "3.11"
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - pip install --quiet uv
    - python3 _tools/tests.py
    - python3 _tools/kbgit.py check-trailers
  rules:
    - when: manual
      allow_failure: true

# The suite on Windows: the project's docker-windows runner. A fresh Windows Server 2025 container per job
# (Hyper-V isolation, Windows PowerShell 5.1), one job at a time; a job waits as pending while the runner is offline.
# The image's `python` installs uv, and uv the pinned CPython; MinGit (SHA-256 checked) puts git on PATH and its own
# sh last, as Git Bash would have it, so the launcher tests run too.
kb-tests-windows:
  stage: test
  tags: [docker-windows]
  image: python:3.14-windowsservercore-ltsc2025
  # The run takes longer than the gap between the query log's automatic pushes: once started, a newer pipeline on
  # main does not cancel it (auto_cancel on_new_commit conservative, the default).
  interruptible: false
  # A job-level timeout takes precedence over the project's 1 h default.
  timeout: 30m
  variables:
    GIT_DEPTH: "0"
    MINGIT_URL: https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.1/MinGit-2.56.0-64-bit.zip
    MINGIT_SHA256: 064b440ff870ed5198527e8f3a92cdf5bd2fd0fedf5e718af95e3fdaddeff718
    # The clone belongs to another account than the container's user, and the tests' git runs without global or
    # system config: safe.directory from the environment is command-line scope, which git honours.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "*"
    # `KB_TEST_TIMEOUT_FACTOR` multiplies the ceiling's `max_seconds` on a CI runner (`tests.py`), since the container
    # is slower than the host the seconds were set on.
    KB_TEST_TIMEOUT_FACTOR: "3"
  script:
    - |
      $ProgressPreference = 'SilentlyContinue'
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Invoke-WebRequest -UseBasicParsing -Uri $env:MINGIT_URL -OutFile C:\mingit.zip
      if ((Get-FileHash C:\mingit.zip -Algorithm SHA256).Hash -ne $env:MINGIT_SHA256) { Write-Error 'MinGit SHA-256 mismatch'; exit 1 }
      Expand-Archive C:\mingit.zip -DestinationPath C:\MinGit
      $env:PATH = 'C:\MinGit\cmd;' + $env:PATH
    - git config --global --add safe.directory '*'
    - python --version
    - python -m pip install --quiet --disable-pip-version-check uv
    - |
      $env:PATH = 'C:\MinGit\cmd;' + (python -c "import sysconfig; print(sysconfig.get_path('scripts'))") + ';' + $env:PATH + ';C:\MinGit\usr\bin'
      uv --version
      # PowerShell 5.1 does not stop on a native command's exit code
      python _tools/tests.py --durations=10
      exit $LASTEXITCODE
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
