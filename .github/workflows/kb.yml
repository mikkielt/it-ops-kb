# CI for it-ops-kb on GitHub. Direct-push model: agents push to main after `kbgit.py sync --push` (and the pre-push
# hook) ran the same gate locally; this workflow is the safety net that also catches a `git push --no-verify`. It
# detects a bad push after the fact; it cannot prevent one without a PR workflow.
name: kb

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:
    inputs:
      write_bytecode:
        description: "Let Python write .pyc files in this run (drops PYTHONDONTWRITEBYTECODE), to compare both arms of a timing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kb-${{ github.ref }}
  cancel-in-progress: true

env:
  # An empty value counts as unset for Python, so a dispatch with write_bytecode true writes .pyc files.
  PYTHONDONTWRITEBYTECODE: ${{ !inputs.write_bytecode && '1' || '' }}

jobs:
  # The full image has git, so the git scenarios run instead of skipping; a full clone keeps the history the KB-*
  # commit trailers check reads. The runner's CPU and the versions print before the tests, the log names the ten
  # slowest tests, and the trailers check runs whatever the tests did.
  kb-tests:
    runs-on: ubuntu-latest
    container: python:3.14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pip install --quiet uv
      - name: Runner and versions
        run: |
          nproc
          grep -m1 "model name" /proc/cpuinfo
          python3 --version
          uv run --quiet --frozen python -m pytest --version
      - run: python3 _tools/tests.py --durations 10
      - if: always()
        run: python3 _tools/kbgit.py check-trailers

  # The public home never gets the query log's store or a root's observed signals (kb/_self/git.md, Public home): a
  # pushed ref whose history touches kb/_querylog or any _logs.csv fails. Runs only where the repository variable KB_PUBLIC_HOME is `true`; a clone hosted
  # elsewhere without it keeps its store.
  kb-public:
    if: vars.KB_PUBLIC_HOME == 'true'
    runs-on: ubuntu-latest
    container: python:3.14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 _tools/kbgit.py check-public HEAD
